<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>영화 예약 시스템</title>
    <link rel-"stylesheet" href="./movie_main.css">
</head>
<body>
    
    <div style="width: 50%; margin: 0 auto; font-family: Arial, sans-serif; background-color: #f9f9f9; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);">
        <h2 style="text-align: center; color: #333;">영화 예약 폼</h2>
        <form id="frm" action="./movie_reservok.do" method="POST" onsubmit="return reserve()">
            <div style="margin-bottom: 15px;">
            	<!-- 예매 고객의 고유번호 코드 (js 난수로 자동생성) -->
            	<input type="hidden" name="usercode" value="">
                <!-- 영화의 고유번호 코드 -->
                <input type="hidden" name="moviecode" value="402">
                <label for="customerName" style="display: block; font-weight: bold; margin-bottom: 5px;">고객명:</label>
                <input type="text" id="customerName" name="mname" placeholder="고객명을 입력하세요" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;" >
            </div>
            <div style="margin-bottom: 15px;">
                <label for="movieName" style="display: block; font-weight: bold; margin-bottom: 5px;">영화명:</label>
                <input type="text" id="movie-name" name="movienm" value="거룩한 밤: 데몬 헌터스"  readonly="readonly" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label for="reservationDate" style="display: block; font-weight: bold; margin-bottom: 5px;">예매일자:</label>
                <input type="date" id="reservationDate" name="mdate" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;" >
            </div>
            <div style="margin-bottom: 15px;">
                <label for="reservationTime" style="display: block; font-weight: bold; margin-bottom: 5px;">예매 시간:</label>
                <select id="reservationTime" name="mtime" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;" >
                <option value = "">예매시간을 선택하세요</option>
                <option value = "10:00">오전 10:00</option>
                <option value = "13:00">오후 13:00</option>
                <option value = "16:00">오후 16:00</option>
                <option value = "20:00">오후 20:00</option>
                </select>
            </div>
            <div style="margin-bottom: 15px;">
                <label for="numberOfPeople" style="display: block; font-weight: bold; margin-bottom: 5px;">인원수:</label>
                <input type="text" id="numberOfPeople" name="mperson" placeholder="인원수를 입력하세요" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;" min="1">
            </div>
            <div style="text-align: center;">
                <button type="submit" style="background-color: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;">예약하기</button>
            </div>
        </form>
    </div>
    <script src="./movie_main.js?v=1">


    </script>
</body>
</html>
